name: techzone

services:
  backend:
    build:
      context: ./backend-techzone
      dockerfile: Dockerfile
    container_name: techzone-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./backend-techzone/.env
    networks:
      - techzone-net

  frontend:
    build:
      context: ./frontend-techzone
      dockerfile: Dockerfile
    container_name: techzone-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - techzone-net

networks:
  techzone-net:
    driver: bridge
