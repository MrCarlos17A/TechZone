<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/plantilla :: cabecera('TechZone - Pedido #' + ${venta.idVenta})}"></head>

<body>
    <header th:replace="~{fragments/plantilla :: barra-navegacion('')}"></header>

    <main class="container my-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/mis-pedidos}">Mis Pedidos</a></li>
                <li class="breadcrumb-item active" th:text="'Pedido #' + ${venta.idVenta}">Pedido</li>
            </ol>
        </nav>

        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="bi bi-receipt"></i> Pedido #<span th:text="${venta.idVenta}">1</span></h4>
                <span class="badge fs-6"
                    th:classappend="${venta.estado == 'PENDIENTE' ? 'bg-warning text-dark' : (venta.estado == 'PROCESADO' ? 'bg-info' : (venta.estado == 'ENVIADO' ? 'bg-primary' : (venta.estado == 'ENTREGADO' ? 'bg-success' : 'bg-danger')))}"
                    th:text="${venta.estado}">PENDIENTE</span>
            </div>
            <div class="card-body">
                <div class="row mb-4">
                    <div class="col-md-4">
                        <h6 class="text-muted">Fecha</h6>
                        <p th:text="${fechaVenta}">01/01/2026 12:00</p>
                    </div>
                    <div class="col-md-4">
                        <h6 class="text-muted">Direccion de envio</h6>
                        <p th:text="${venta.direccionEnvio != null ? venta.direccionEnvio : 'No especificada'}">Sin direccion</p>
                    </div>
                    <div class="col-md-4">
                        <h6 class="text-muted">Total</h6>
                        <p class="fw-bold text-primary fs-5" th:text="'S/ ' + ${venta.total}">S/ 0.00</p>
                    </div>
                </div>

                <h5 class="mb-3">Productos</h5>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Producto</th>
                                <th class="text-center">Cantidad</th>
                                <th class="text-end">Precio unit.</th>
                                <th class="text-end">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="dv : ${detalles}">
                                <td>
                                    <span th:text="${dv.producto != null ? dv.producto.nombre : 'Producto'}">Producto</span>
                                </td>
                                <td class="text-center" th:text="${dv.cantidad}">1</td>
                                <td class="text-end" th:text="'S/ ' + ${dv.precioUnitario}">S/ 0.00</td>
                                <td class="text-end fw-bold" th:text="'S/ ' + ${dv.subTotalVenta}">S/ 0.00</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="row justify-content-end">
                    <div class="col-md-4">
                        <table class="table table-sm">
                            <tbody>
                                <tr>
                                    <td>Subtotal</td>
                                    <td class="text-end" th:text="'S/ ' + ${venta.subtotal}">S/ 0.00</td>
                                </tr>
                                <tr>
                                    <td>IGV (18%)</td>
                                    <td class="text-end" th:text="'S/ ' + ${venta.igv}">S/ 0.00</td>
                                </tr>
                                <tr class="fw-bold fs-5">
                                    <td>Total</td>
                                    <td class="text-end text-primary" th:text="'S/ ' + ${venta.total}">S/ 0.00</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="card-footer">
                <a th:href="@{/mis-pedidos}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Volver a Mis Pedidos
                </a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/plantilla :: pie}"></footer>
</body>

</html>
