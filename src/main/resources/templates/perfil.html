<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/plantilla :: cabecera('TechZone - Mi Perfil')}"></head>

<body>
    <header th:replace="~{fragments/plantilla :: barra-navegacion('')}"></header>

    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h1 class="mb-4"><i class="bi bi-person-circle"></i> Mi Perfil</h1>

                <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle"></i> <span th:text="${exito}">Exito</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="bi bi-pencil-square"></i> Editar mis datos</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/actualizar-perfil}" method="post">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nombres" class="form-label">Nombres</label>
                                    <input type="text" class="form-control" id="nombres" name="nombres"
                                        th:value="${usuario.nombres}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="apellidos" class="form-label">Apellidos</label>
                                    <input type="text" class="form-control" id="apellidos" name="apellidos"
                                        th:value="${usuario.apellidos}" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo electronico</label>
                                <input type="email" class="form-control" id="correo" th:value="${usuario.correo}"
                                    disabled>
                                <small class="text-muted">El correo no se puede modificar</small>
                            </div>
                            <div class="mb-3">
                                <label for="telefono" class="form-label">Telefono</label>
                                <input type="text" class="form-control" id="telefono" name="telefono"
                                    th:value="${usuario.telefono}">
                            </div>
                            <div class="mb-3">
                                <label for="rol" class="form-label">Rol</label>
                                <input type="text" class="form-control" th:value="${usuario.rol.nombre}" disabled>
                            </div>

                            <hr>
                            <h5><i class="bi bi-lock"></i> Cambiar contrasena</h5>
                            <small class="text-muted mb-3 d-block">Deja en blanco si no deseas cambiar la
                                contrasena</small>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="passwordActual" class="form-label">Contrasena actual</label>
                                    <input type="password" class="form-control" id="passwordActual"
                                        name="passwordActual">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="passwordNuevo" class="form-label">Nueva contrasena</label>
                                    <input type="password" class="form-control" id="passwordNuevo" name="passwordNuevo">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i> Guardar Cambios
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/plantilla :: pie}"></footer>
</body>

</html>
