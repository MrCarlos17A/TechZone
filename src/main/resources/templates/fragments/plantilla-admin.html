<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <header th:fragment="barra-superior">
        <nav class="navbar navbar-expand-lg navbar-dark barra-superior-admin">
            <div class="container-fluid">
                <button class="btn btn-outline-light boton-contraer" title="Contraer / expandir menu">
                    <i class="bi bi-list"></i>
                </button>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuAdmin">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuAdmin">
                    <div class="d-flex align-items-center gap-2 ms-auto">
                        <span class="text-light" th:if="${usuarioLogueado.isPresent()}">
                            <i class="bi bi-person-check"></i>
                            <span th:text="${usuarioLogueado.get().persona != null ? usuarioLogueado.get().persona.nombres + ' ' + usuarioLogueado.get().persona.apellidoPaterno : usuarioLogueado.get().correo}">Admin</span>
                            <small class="badge bg-info ms-1" th:text="${usuarioLogueado.get().rol.nombre}">Rol</small>
                        </span>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <footer th:fragment="pie-admin">
        <div class="pie-admin text-light py-3 mt-5">
            <div class="container-fluid">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
                    <p class="small mb-0">
                        <img th:src="@{/Assets/IMG/Logo/TechZone.png}" alt="TechZone" style="height: 24px;">
                        <strong>TechZone</strong> - Panel de Administracion
                    </p>
                    <p class="small mb-0">&copy; 2026 TECHZONE. Todos los derechos reservados.</p>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            (function () {
                var pagina = document.getElementById('paginaAdmin');
                var icono = document.getElementById('iconoContraer');
                if (!pagina) return;
                function aplicar(contraido) {
                    pagina.classList.toggle('contraido', contraido);
                    if (icono) {
                        icono.className = contraido ? 'bi bi-chevron-right' : 'bi bi-chevron-left';
                    }
                    try {
                        localStorage.setItem('barraContraida', contraido ? '1' : '0');
                    } catch (e) { /* sin almacenamiento */ }
                }
                var inicial = false;
                try {
                    inicial = localStorage.getItem('barraContraida') === '1';
                } catch (e) { /* sin almacenamiento */ }
                aplicar(inicial);
                document.querySelectorAll('.boton-contraer').forEach(function (boton) {
                    boton.addEventListener('click', function () {
                        aplicar(!pagina.classList.contains('contraido'));
                    });
                });
            })();
        </script>
        <!-- Modal unico de confirmacion: eliminaciones y acciones de estado -->
        <div class="modal fade" id="modalConfirmacion" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-danger text-white" id="cabeceraConfirmacion">
                        <h5 class="modal-title" id="tituloConfirmacion">
                            <i class="bi bi-exclamation-triangle"></i> Confirmar
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <p class="mb-1" id="textoConfirmacion">Esta seguro de realizar esta accion?</p>
                        <p class="text-muted small mb-0" id="notaConfirmacion">Esta accion no se puede deshacer.</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" id="btnConfirmarAccion" class="btn btn-danger">Aceptar</button>
                    </div>
                </div>
            </div>
        </div>
        <form id="formConfirmacion" method="post" th:action="@{/}" style="display:none"></form>
        <script>
            (function () {
                var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('modalConfirmacion'));
                var form = document.getElementById('formConfirmacion');
                var csrf = form.querySelector('input[name="_csrf"]');

                document.addEventListener('click', function (e) {
                    var b = e.target.closest('[data-eliminar], [data-confirmar]');
                    if (!b) return;

                    var url = b.dataset.accion || b.getAttribute('href');
                    if (!url || url === '#') return;
                    e.preventDefault();

                    var esEliminar = b.hasAttribute('data-eliminar');
                    var estilo = b.dataset.estilo || 'danger';
                    var icono = b.dataset.icono || 'bi-exclamation-triangle';
                    var nombre = b.dataset.nombre;

                    document.getElementById('cabeceraConfirmacion').className =
                        'modal-header text-white bg-' + estilo;
                    document.getElementById('tituloConfirmacion').innerHTML =
                        '<i class="bi ' + icono + '"></i> ' +
                        (b.dataset.titulo || (esEliminar ? 'Confirmar eliminacion' : 'Confirmar accion'));

                    var texto = b.dataset.texto;
                    if (!texto) {
                        texto = esEliminar
                            ? 'Esta seguro de eliminar ' + (nombre || 'este registro') + '?'
                            : 'Esta seguro de realizar esta accion?';
                    }
                    document.getElementById('textoConfirmacion').textContent = texto;
                    document.getElementById('notaConfirmacion').textContent =
                        b.dataset.nota || (esEliminar ? 'Esta accion no se puede deshacer.' : 'Verifique los datos antes de continuar.');

                    var btn = document.getElementById('btnConfirmarAccion');
                    btn.className = 'btn btn-' + estilo;
                    btn.textContent = b.dataset.boton || 'Aceptar';

                    form.method = b.dataset.metodo || 'get';
                    form.action = url;
                    if (csrf) csrf.disabled = (form.method === 'get');

                    modal.show();
                });

                document.getElementById('btnConfirmarAccion').addEventListener('click', function () {
                    form.submit();
                });
            })();
        </script>
    </footer>
</body>
</html>
