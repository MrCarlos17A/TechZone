<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/plantilla :: cabecera('TechZone - Productos')}"></head>

<body>
    <header th:replace="~{fragments/plantilla :: barra-navegacion('productos')}"></header>

    <main class="container my-4">
        <div class="text-center mb-4">
            <h1 class="fw-bold" th:text="${tituloPagina}" style="color: var(--shade-9);">Todos los Productos</h1>
            <p class="text-muted mt-1" th:if="${categoriaActiva == null}" style="color: var(--shade-5) !important;">Explora nuestra coleccion completa de componentes y perifericos</p>
            <p class="text-muted mt-1" th:if="${categoriaActiva != null}" style="color: var(--shade-5) !important;">Mostrando <span class="fw-bold" th:text="${productos.size()}">0</span> producto(s) en <span class="fw-bold" th:text="${categoriaActiva.nombre}">Categoria</span></p>
        </div>

        <!-- Filtros por categoria -->
        <div class="row mb-4" th:if="${!categorias.isEmpty()}">
            <div class="col">
                <div class="filter-container">
                    <div class="d-flex flex-wrap gap-2 align-items-center">
                        <span class="filter-label me-1"><i class="bi bi-funnel-fill"></i> Categorias</span>
                        <a th:href="@{/productos}" class="btn"
                            th:classappend="${categoriaSeleccionada == null} ? 'btn-filtro-activo' : 'btn-filtro'">
                            <i class="bi bi-grid-3x3-gap"></i> Todos
                        </a>
                        <a th:each="cat : ${categorias}" th:href="@{/productos(categoria=${cat.idCategoria})}" class="btn"
                            th:classappend="${categoriaSeleccionada != null and categoriaSeleccionada == cat.idCategoria} ? 'btn-filtro-activo' : 'btn-filtro'">
                            <i th:if="${cat.nombre.toLowerCase().contains('monitor')}" class="bi bi-display"></i>
                            <i th:if="${cat.nombre.toLowerCase().contains('tarjeta')}" class="bi bi-gpu-card"></i>
                            <i th:if="${!cat.nombre.toLowerCase().contains('monitor') and !cat.nombre.toLowerCase().contains('tarjeta')}" class="bi bi-box"></i>
                            <span th:text="${cat.nombre}">Categoria</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Productos -->
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4" id="contenedorProductos">
            <div class="col" th:each="producto : ${productos}">
                <div class="card h-100 producto-card">
                    <div class="producto-img-wrapper">
                        <img th:if="${producto.imagenPrincipal != null}" th:src="${producto.imagenPrincipal}"
                            class="producto-img" th:alt="${producto.nombre}">
                        <div th:unless="${producto.imagenPrincipal != null}" class="producto-img producto-img-placeholder">
                            <i class="bi bi-box-seam"></i>
                        </div>
                        <span class="producto-badge-marca" th:text="${producto.marca.nombre}">Marca</span>
                        <span class="producto-badge-stock"
                            th:classappend="${producto.stock > 5} ? 'stock-ok' : (${producto.stock > 0} ? 'stock-bajo' : 'stock-agotado')"
                            th:text="${producto.stock > 0} ? 'Stock: ' + ${producto.stock} : 'Sin stock'">Stock</span>
                    </div>
                    <div class="card-body d-flex flex-column p-3">
                        <h5 class="producto-nombre" th:text="${producto.nombre}">Producto</h5>
                        <p class="producto-desc" th:text="${producto.descripcion}">Descripcion</p>
                        <div class="mt-auto">
                            <div class="producto-precio">
                                <span class="precio-moneda">S/</span>
                                <span class="precio-valor" th:text="${#numbers.formatDecimal(producto.precioVenta, 1, 2)}">0.00</span>
                            </div>
                            <button class="btn btn-primary w-100 mt-2 agregar-carrito" th:data-id="${producto.idProducto}"
                                th:data-nombre="${producto.nombre}" th:data-precio="${producto.precioVenta}"
                                th:data-imagen="${producto.imagenPrincipal}">
                                <i class="bi bi-cart-plus"></i> Agregar al Carrito
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Estado vacio -->
        <div class="text-center py-5" th:if="${productos.isEmpty()}">
            <div class="estado-vacio">
                <i class="bi bi-search estado-vacio-icono"></i>
                <h3 class="mt-3 fw-bold" style="color: var(--shade-7);">Sin resultados</h3>
                <p class="text-muted">No hay productos en esta categoria por el momento</p>
                <a th:href="@{/productos}" class="btn btn-primary mt-2">
                    <i class="bi bi-arrow-counterclockwise"></i> Ver todos los productos
                </a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/plantilla :: pie}"></footer>

    <script th:src="@{/js/carrito.js}"></script>
    <script th:src="@{/js/checkout.js}"></script>
</body>

</html>
