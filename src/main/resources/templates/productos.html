<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/plantilla :: cabecera('TechZone - Productos')}"></head>

<body>
    <header th:replace="~{fragments/plantilla :: barra-navegacion('productos')}"></header>

    <main class="container my-4">
        <h1 class="text-center mb-4">Todos los Productos</h1>

        <!-- Filtros por categoria -->
        <div class="row mb-4" th:if="${!categorias.isEmpty()}">
            <div class="col">
                <div class="filter-container p-3 rounded-3 shadow-sm">
                    <div class="d-flex flex-wrap gap-2 align-items-center">
                        <span class="filter-label me-2"><i class="bi bi-funnel"></i> Filtrar:</span>
                        <a th:href="@{/productos}"
                            class="btn btn-sm rounded-pill"
                            th:classappend="${categoriaSeleccionada == null} ? 'btn-primary' : 'btn-outline-primary'">
                            Todos
                        </a>
                        <a th:each="cat : ${categorias}" th:href="@{/productos?categoria=} + ${cat.idCategoria}"
                            class="btn btn-sm rounded-pill"
                            th:classappend="${categoriaSeleccionada != null and categoriaSeleccionada == cat.idCategoria} ? 'btn-primary' : 'btn-outline-primary'"
                            th:text="${cat.nombre}">Categoria</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
            <div class="col" th:each="producto : ${productos}">
                <div class="card h-100 shadow-sm">
                    <img th:if="${producto.imagen != null}" th:src="${producto.imagen}" class="card-img-top"
                        th:alt="${producto.nombre}">
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="badge bg-secondary" th:text="${producto.marca.nombre}">Marca</span>
                            <span class="badge bg-info" th:text="${producto.categoria.nombre}">Categoria</span>
                        </div>
                        <h5 class="card-title" th:text="${producto.nombre}">Producto</h5>
                        <p class="card-text text-muted small" th:text="${producto.descripcion}">Descripcion</p>
                        <div class="mt-auto">
                            <div class="d-flex justify-content-between align-items-center">
                                <p class="fw-bold text-primary fs-4 mb-0" th:text="'S/ ' + ${#numbers.formatDecimal(producto.precio, 1, 2)}">S/ 0.00</p>
                                <span class="badge" th:classappend="${producto.stock > 0} ? 'bg-success' : 'bg-danger'"
                                    th:text="${producto.stock > 0} ? 'Disponible (' + ${producto.stock} + ')' : 'Sin stock'">Disponible</span>
                            </div>
                        </div>
                        <button class="btn btn-primary mt-2 agregar-carrito" th:data-id="${producto.idProducto}"
                            th:data-nombre="${producto.nombre}" th:data-precio="${producto.precio}"
                            th:data-imagen="${producto.imagen}">
                            <i class="bi bi-cart-plus"></i> Agregar al Carrito
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center py-5" th:if="${productos.isEmpty()}">
            <i class="bi bi-box-seam display-1 text-muted"></i>
            <h3 class="text-muted mt-3">No hay productos en esta categoria</h3>
            <a th:href="@{/productos}" class="btn btn-primary mt-3">Ver todos los productos</a>
        </div>
    </main>

    <footer th:replace="~{fragments/plantilla :: pie}"></footer>

    <script th:src="@{/js/carrito.js}"></script>
</body>

</html>
