<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/plantilla :: cabecera('Admin - Listar Ventas')}"></head>

<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('ventas')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-receipt"></i> Ventas</h1>
            <a th:href="@{/admin/ventas/crear}" class="btn btn-success">
                <i class="bi bi-plus-circle"></i> Nueva Venta
            </a>
        </div>

        <!-- Filtro por estado -->
        <div class="mb-3">
            <div class="btn-group btn-group-sm">
                <a th:href="@{/admin/ventas}" class="btn btn-outline-primary"
                    th:classappend="${param.estado == null} ? ' active'">Todas</a>
                <a th:each="est : ${estadosDisponibles}" th:href="@{/admin/ventas(estado=${est})}"
                    class="btn btn-outline-primary"
                    th:classappend="${param.estado != null and param.estado[0] == est} ? ' active'"
                    th:text="${est}">Estado</a>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Empleado</th>
                        <th>Fecha</th>
                        <th>Subtotal</th>
                        <th>IGV</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="venta : ${ventas}">
                        <td th:text="${venta.idVenta}">1</td>
                        <td th:text="${venta.cliente != null and venta.cliente.persona != null ? venta.cliente.persona.nombres + ' ' + venta.cliente.persona.apellidoPaterno : 'Sin cliente'}">Cliente</td>
                        <td th:text="${venta.empleado != null and venta.empleado.persona != null ? venta.empleado.persona.nombres + ' ' + venta.empleado.persona.apellidoPaterno : 'Sin empleado'}">Empleado</td>
                        <td th:text="${venta.fechaVenta != null ? #temporals.format(venta.fechaVenta, 'dd/MM/yyyy HH:mm') : '-'}">Fecha</td>
                        <td th:text="'S/ ' + ${#numbers.formatDecimal(venta.subtotal, 1, 2)}">S/ 0.00</td>
                        <td th:text="'S/ ' + ${#numbers.formatDecimal(venta.igv, 1, 2)}">S/ 0.00</td>
                        <td th:text="'S/ ' + ${#numbers.formatDecimal(venta.total, 1, 2)}">S/ 0.00</td>
                        <td>
                            <span class="badge"
                                th:classappend="${venta.estado == 'PENDIENTE' ? 'bg-warning text-dark' : (venta.estado == 'CANCELADA' ? 'bg-danger' : 'bg-success')}"
                                th:text="${venta.estado}">PENDIENTE</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/ventas/{id}(id=${venta.idVenta})}" class="btn btn-sm btn-info">
                                <i class="bi bi-eye"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="text-center py-4" th:if="${#lists.isEmpty(ventas)}">
            <p class="text-muted">No hay ventas registradas</p>
        </div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>

</html>
