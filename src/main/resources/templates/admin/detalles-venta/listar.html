<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Admin - Detalles de Venta')}"></head>
<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('detalles-venta')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="bi bi-list-check"></i> Detalles de Venta</h1>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr><th>ID</th><th>Venta</th><th>Producto</th><th>Cantidad</th><th>P. Unitario</th><th>Subtotal</th><th>Acciones</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="dv : ${detalles}">
                                <td th:text="${dv.idDetalleVenta}">1</td>
                                <td th:text="${dv.venta != null ? 'Venta #' + dv.venta.idVenta : '-'}">Venta</td>
                                <td th:text="${dv.producto != null ? dv.producto.nombre : '-'}">Producto</td>
                                <td th:text="${dv.cantidad}">0</td>
                                <td th:text="'S/ ' + ${#numbers.formatDecimal(dv.precioUnitario, 1, 2)}">S/ 0.00</td>
                                <td th:text="'S/ ' + ${#numbers.formatDecimal(dv.subTotalVenta, 1, 2)}">S/ 0.00</td>
                                <td>
                                    <a th:href="@{/admin/detalles-venta/ver/{id}(id=${dv.idDetalleVenta})}" class="btn btn-sm btn-info"><i class="bi bi-eye"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="text-center py-4" th:if="${#lists.isEmpty(detalles)}"><p class="text-muted">No hay detalles registrados</p></div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>
</html>
