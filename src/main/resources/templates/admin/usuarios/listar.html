<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/plantilla :: cabecera('Admin - Listar Usuarios')}"></head>

<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('usuarios')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
        <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${exito}">Exito</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1><i class="bi bi-people"></i> Usuarios</h1>
                <p class="text-muted mb-0 mt-1" style="font-size:0.88rem;">
                    <span class="filtro-contador-resultados"><strong th:text="${#lists.size(usuarios)}">0</strong> usuario(s)</span>
                </p>
            </div>
            <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-success">
                <i class="bi bi-plus-circle"></i> Nuevo Usuario
            </a>
        </div>

        <!-- Barra de filtro -->
        <div class="filtro-admin-barra">
            <form th:action="@{/admin/usuarios}" method="get">
                <div class="row g-2 align-items-end">
                    <div class="col-md-5">
                        <label class="form-label filtro-label-admin">Buscar usuario</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" name="q" th:value="${q}" placeholder="Correo, nombres, rol, estado...">
                        </div>
                    </div>
                    <div class="col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btn-buscar flex-fill"><i class="bi bi-funnel"></i> Filtrar</button>
                        <a th:href="@{/admin/usuarios}" class="btn btn-limpiar" title="Limpiar"><i class="bi bi-x-lg"></i></a>
                    </div>
                </div>
            </form>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombres</th>
                        <th>Ap. Paterno</th>
                        <th>Ap. Materno</th>
                        <th>Nro. Doc.</th>
                        <th>Telefono</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.idUsuario}">1</td>
                        <td th:text="${usuario.persona != null ? usuario.persona.nombres : 'Sin persona'}">Nombres</td>
                        <td th:text="${usuario.persona != null ? usuario.persona.apellidoPaterno : '-'}">Paterno</td>
                        <td th:text="${usuario.persona != null ? usuario.persona.apellidoMaterno : '-'}">Materno</td>
                        <td th:text="${usuario.persona != null ? usuario.persona.numeroDocumento : '-'}">Doc</td>
                        <td th:text="${usuario.persona != null ? usuario.persona.telefono : '-'}">Tel</td>
                        <td th:text="${usuario.correo}">correo@correo.com</td>
                        <td th:text="${usuario.rol != null ? usuario.rol.nombre : 'Sin rol'}">Rol</td>
                        <td>
                            <span class="badge" th:classappend="${usuario.estado == 'activo'} ? 'bg-success' : 'bg-secondary'"
                                th:text="${usuario.estado == 'activo'} ? 'Activo' : 'Inactivo'">Activo</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/usuarios/editar/{id}(id=${usuario.idUsuario})}"
                                class="btn btn-sm btn-warning">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/admin/usuarios/eliminar/{id}(id=${usuario.idUsuario})}"
                                class="btn btn-sm btn-danger" data-eliminar title="Eliminar"
                                th:attr="data-nombre=${usuario.correo}">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="estado-vacio-admin" th:if="${#lists.isEmpty(usuarios)}">
            <i class="bi bi-people"></i>
            <h5>No se encontraron usuarios</h5>
            <p th:text="${q != null and q != ''} ? 'Ningun usuario coincide con la busqueda.' : 'No hay usuarios registrados.'">No hay usuarios</p>
            <a th:if="${q != null and q != ''}" th:href="@{/admin/usuarios}" class="btn btn-outline-primary btn-sm mt-2">
                <i class="bi bi-arrow-counterclockwise"></i> Limpiar filtro
            </a>
        </div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>

</html>
