<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/plantilla :: cabecera('Admin - Listar Categorias')}"></head>

<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('categorias')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
        <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${exito}">Exito</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1><i class="bi bi-tags"></i> Categorias</h1>
                <p class="text-muted mb-0 mt-1" style="font-size:0.88rem;">
                    <span class="filtro-contador-resultados"><strong th:text="${#lists.size(categorias)}">0</strong> categoria(s)</span>
                </p>
            </div>
            <a th:href="@{/admin/categorias/nueva}" class="btn btn-success">
                <i class="bi bi-plus-circle"></i> Nueva Categoria
            </a>
        </div>

        <!-- Barra de filtro -->
        <div class="filtro-admin-barra">
            <form th:action="@{/admin/categorias}" method="get">
                <div class="row g-2 align-items-end">
                    <div class="col-md-5">
                        <label class="form-label filtro-label-admin">Buscar categoria</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" name="q" th:value="${q}" placeholder="Nombre de la categoria...">
                        </div>
                    </div>
                    <div class="col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btn-buscar flex-fill"><i class="bi bi-funnel"></i> Filtrar</button>
                        <a th:href="@{/admin/categorias}" class="btn btn-limpiar" title="Limpiar"><i class="bi bi-x-lg"></i></a>
                    </div>
                </div>
            </form>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cat : ${categorias}">
                        <td th:text="${cat.idCategoria}">1</td>
                        <td th:text="${cat.nombre}">Categoria</td>
                        <td>
                            <span class="badge" th:classappend="${cat.vigente} ? 'bg-success' : 'bg-secondary'"
                                th:text="${cat.vigente} ? 'Activa' : 'Inactiva'">Activa</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/categorias/editar/{id}(id=${cat.idCategoria})}"
                                class="btn btn-sm btn-warning">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/admin/categorias/eliminar/{id}(id=${cat.idCategoria})}"
                                class="btn btn-sm btn-danger" data-eliminar title="Eliminar"
                                th:attr="data-nombre=${cat.nombre}">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="estado-vacio-admin" th:if="${#lists.isEmpty(categorias)}">
            <i class="bi bi-tags"></i>
            <h5>No se encontraron categorias</h5>
            <p th:text="${q != null and q != ''} ? 'Ninguna categoria coincide con la busqueda.' : 'No hay categorias registradas.'">No hay categorias</p>
            <a th:if="${q != null and q != ''}" th:href="@{/admin/categorias}" class="btn btn-outline-primary btn-sm mt-2">
                <i class="bi bi-arrow-counterclockwise"></i> Limpiar filtro
            </a>
        </div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>

</html>
