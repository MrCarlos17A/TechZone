<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/plantilla :: cabecera('Admin - Formulario Categoria')}"></head>

<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('categorias')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-info text-white">
                        <h4 class="mb-0">
                            <i class="bi bi-tags"></i>
                            <span
                                th:text="${categoria.idCategoria != null} ? 'Editar Categoria' : 'Nueva Categoria'">Formulario</span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <form
                            th:action="${categoria.idCategoria != null} ? @{/admin/categorias/actualizar/{id}(id=${categoria.idCategoria})} : @{/admin/categorias/guardar}"
                            method="post">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre de la Categoria</label>
                                <input type="text" class="form-control" id="nombre" name="nombre"
                                    th:value="${categoria.nombre}" required>
                            </div>
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripcion</label>
                                <textarea class="form-control" id="descripcion" name="descripcion" rows="3"
                                    th:text="${categoria.descripcion}"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="estadoCategoria" class="form-label">Estado</label>
                                <select class="form-select" id="estadoCategoria" name="estadoCategoria">
                                    <option value="true" th:selected="${categoria.estadoCategoria}">Activa</option>
                                    <option value="false"
                                        th:selected="${categoria.estadoCategoria != null and !categoria.estadoCategoria}">Inactiva
                                    </option>
                                </select>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-info text-white">
                                    <i class="bi bi-save"></i> Guardar
                                </button>
                                <a th:href="@{/admin/categorias}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>

</html>
