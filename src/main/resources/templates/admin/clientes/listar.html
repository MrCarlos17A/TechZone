<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Admin - Clientes')}"></head>
<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('clientes')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
                <div th:if="${exito}" class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle"></i> <span th:text="${exito}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="bi bi-person-badge"></i> Clientes</h1>
                    <a th:href="@{/admin/clientes/nuevo}" class="btn btn-success"><i class="bi bi-plus-circle"></i> Nuevo Cliente</a>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr><th>ID</th><th>Persona</th><th>Doc.</th><th>Total Gastado</th><th>Ultima Compra</th><th>Acciones</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${clientes}">
                                <td th:text="${c.idCliente}">1</td>
                                <td th:text="${c.persona != null ? c.persona.nombres + ' ' + c.persona.apellidoPaterno : 'Sin persona'}">Persona</td>
                                <td th:text="${c.persona != null ? c.persona.numeroDocumento : '-'}">Doc</td>
                                <td th:text="'S/ ' + ${#numbers.formatDecimal(c.totalGastado, 1, 2)}">S/ 0.00</td>
                                <td th:text="${c.fechaUltimaCompra != null ? #temporals.format(c.fechaUltimaCompra, 'dd/MM/yyyy') : '-'}">Fecha</td>
                                <td>
                                    <a th:href="@{/admin/clientes/editar/{id}(id=${c.idCliente})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{/admin/clientes/eliminar/{id}(id=${c.idCliente})}" class="btn btn-sm btn-danger" data-eliminar th:attr="data-nombre=${c.persona != null ? c.persona.nombres : 'cliente'}"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="text-center py-4" th:if="${#lists.isEmpty(clientes)}"><p class="text-muted">No hay clientes registrados</p></div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>
</html>
