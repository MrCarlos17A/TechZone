<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Admin - Clientes')}"></head>
<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('clientes')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
                <div th:if="${exito}" class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle"></i> <span th:text="${exito}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1><i class="bi bi-person-badge"></i> Clientes</h1>
                        <p class="text-muted mb-0 mt-1" style="font-size:0.88rem;">
                            <span class="filtro-contador-resultados"><strong th:text="${#lists.size(clientes)}">0</strong> cliente(s)</span>
                        </p>
                    </div>
                    <a th:href="@{/admin/clientes/nuevo}" class="btn btn-success"><i class="bi bi-plus-circle"></i> Nuevo Cliente</a>
                </div>
                <!-- Barra de filtro -->
                <div class="filtro-admin-barra">
                    <form th:action="@{/admin/clientes}" method="get">
                        <div class="row g-2 align-items-end">
                            <div class="col-md-5">
                                <label class="form-label filtro-label-admin">Buscar cliente</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                                    <input type="text" class="form-control" name="q" th:value="${q}" placeholder="Nombres, apellidos, documento...">
                                </div>
                            </div>
                            <div class="col-md-3 d-flex gap-2">
                                <button type="submit" class="btn btn-buscar flex-fill"><i class="bi bi-funnel"></i> Filtrar</button>
                                <a th:href="@{/admin/clientes}" class="btn btn-limpiar" title="Limpiar"><i class="bi bi-x-lg"></i></a>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr><th>ID</th><th>Nombres</th><th>Ap. Paterno</th><th>Ap. Materno</th><th>Tipo Doc.</th><th>Nro. Doc.</th><th>Telefono</th><th>Direccion</th><th>Distrito</th><th>Total Gastado</th><th>Ultima Compra</th><th>Acciones</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${clientes}">
                                <td th:text="${c.idCliente}">1</td>
                                <td th:text="${c.persona != null ? c.persona.nombres : 'Sin persona'}">Nombres</td>
                                <td th:text="${c.persona != null ? c.persona.apellidoPaterno : '-'}">Paterno</td>
                                <td th:text="${c.persona != null ? c.persona.apellidoMaterno : '-'}">Materno</td>
                                <td th:text="${c.persona != null and c.persona.tipoDocumento != null ? c.persona.tipoDocumento.nombre : '-'}">Tipo</td>
                                <td th:text="${c.persona != null ? c.persona.numeroDocumento : '-'}">Doc</td>
                                <td th:text="${c.persona != null ? c.persona.telefono : '-'}">Tel</td>
                                <td th:text="${c.persona != null and c.persona.direccion != null ? c.persona.direccion : '-'}">Dir</td>
                                <td th:text="${c.persona != null and c.persona.ubigeo != null ? c.persona.ubigeo.distrito : '-'}">Distrito</td>
                                <td th:text="'S/ ' + ${#numbers.formatDecimal(c.totalGastado, 1, 2)}">S/ 0.00</td>
                                <td th:text="${c.fechaUltimaCompra != null ? #temporals.format(c.fechaUltimaCompra, 'dd/MM/yyyy') : '-'}">Fecha</td>
                                <td>
                                    <a th:href="@{/admin/clientes/editar/{id}(id=${c.idCliente})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{/admin/clientes/eliminar/{id}(id=${c.idCliente})}" class="btn btn-sm btn-danger" data-eliminar th:attr="data-nombre=${c.persona != null ? c.persona.nombres : 'cliente'}"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="estado-vacio-admin" th:if="${#lists.isEmpty(clientes)}">
                    <i class="bi bi-person-badge"></i>
                    <h5>No se encontraron clientes</h5>
                    <p th:text="${q != null and q != ''} ? 'Ningun cliente coincide con la busqueda.' : 'No hay clientes registrados.'">No hay clientes</p>
                    <a th:if="${q != null and q != ''}" th:href="@{/admin/clientes}" class="btn btn-outline-primary btn-sm mt-2">
                        <i class="bi bi-arrow-counterclockwise"></i> Limpiar filtro
                    </a>
                </div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>
</html>
