<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Admin - Formulario Cliente')}"></head>
<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('clientes')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <div class="card shadow">
                            <div class="card-header bg-success text-white">
                                <h4 class="mb-0"><i class="bi bi-person-badge"></i>
                                    <span th:text="${cliente.idCliente != null} ? 'Editar Cliente' : 'Nuevo Cliente'">Formulario</span>
                                </h4>
                            </div>
                            <div class="card-body">
                                <form th:action="${cliente.idCliente != null} ? @{/admin/clientes/actualizar/{id}(id=${cliente.idCliente})} : @{/admin/clientes/guardar}" method="post">
                                    <div class="mb-3">
                                        <label class="form-label">Persona</label>
                                        <select class="form-select" name="persona" required>
                                            <option value="">Seleccionar persona...</option>
                                            <option th:each="p : ${personas}" th:value="${p.idPersona}"
                                                th:text="${p.nombres + ' ' + p.apellidoPaterno + ' ' + p.apellidoMaterno}"
                                                th:selected="${cliente.persona != null and cliente.persona.idPersona == p.idPersona}"></option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Total Gastado</label>
                                        <input type="number" class="form-control" name="totalGastado" step="0.01" min="0" required th:value="${cliente.totalGastado}">
                                    </div>
                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Guardar</button>
                                        <a th:href="@{/admin/clientes}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Cancelar</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>
</html>
