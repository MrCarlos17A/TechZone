<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Admin - Detalles de Carrito')}"></head>
<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('detalles-carrito')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
                <div th:if="${exito}" class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle"></i> <span th:text="${exito}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="bi bi-cart-dash"></i> Detalles de Carrito</h1>
                    <a th:href="@{/admin/detalles-carrito/nuevo}" class="btn btn-success"><i class="bi bi-plus-circle"></i> Nuevo Detalle</a>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr><th>ID</th><th>Carrito</th><th>Producto</th><th>Cantidad</th><th>Acciones</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="dc : ${detalles}">
                                <td th:text="${dc.idDetalleCarrito}">1</td>
                                <td th:text="${dc.carrito != null ? 'Carrito #' + dc.carrito.idCarrito : '-'}">Carrito</td>
                                <td th:text="${dc.producto != null ? dc.producto.nombre : '-'}">Producto</td>
                                <td th:text="${dc.cantidad}">0</td>
                                <td>
                                    <a th:href="@{/admin/detalles-carrito/eliminar/{id}(id=${dc.idDetalleCarrito})}" class="btn btn-sm btn-danger" data-eliminar><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="text-center py-4" th:if="${#lists.isEmpty(detalles)}"><p class="text-muted">No hay detalles registrados</p></div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>
</html>
