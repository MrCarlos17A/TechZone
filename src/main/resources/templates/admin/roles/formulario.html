<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/plantilla :: cabecera('Admin - Formulario Rol')}"></head>

<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('roles')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-secondary text-white">
                        <h4 class="mb-0">
                            <i class="bi bi-shield-lock"></i>
                            <span th:text="${rol.idRol != null} ? 'Editar Rol' : 'Nuevo Rol'">Formulario</span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <form
                            th:action="${rol.idRol != null} ? @{/admin/roles/actualizar/{id}(id=${rol.idRol})} : @{/admin/roles/guardar}"
                            method="post">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre del Rol</label>
                                <input type="text" class="form-control" id="nombre" name="nombre"
                                    th:value="${rol.nombre}" maxlength="20" required>
                            </div>
                            <div class="mb-3">
                                <label for="vigente" class="form-label">Estado</label>
                                <select class="form-select" id="vigente" name="vigente">
                                    <option value="true" th:selected="${rol.vigente == null or rol.vigente}">Activo</option>
                                    <option value="false" th:selected="${rol.vigente != null and !rol.vigente}">Inactivo</option>
                                </select>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-secondary">
                                    <i class="bi bi-save"></i> Guardar
                                </button>
                                <a th:href="@{/admin/roles}" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left"></i> Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>

</html>
