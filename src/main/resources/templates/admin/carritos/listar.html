<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Admin - Carritos')}"></head>
<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('carritos')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
                <div th:if="${exito}" class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle"></i> <span th:text="${exito}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="bi bi-cart3"></i> Carritos</h1>
                    <a th:href="@{/admin/carritos/nuevo}" class="btn btn-success"><i class="bi bi-plus-circle"></i> Nuevo Carrito</a>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr><th>ID</th><th>Cliente</th><th>Fecha Creacion</th><th>Acciones</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${carritos}">
                                <td th:text="${c.idCarrito}">1</td>
                                <td th:text="${c.cliente != null and c.cliente.persona != null ? c.cliente.persona.nombres + ' ' + c.cliente.persona.apellidoPaterno : 'Sin cliente'}">Cliente</td>
                                <td th:text="${c.fechaCarrito != null ? #temporals.format(c.fechaCarrito, 'dd/MM/yyyy HH:mm') : '-'}">Fecha</td>
                                <td>
                                    <a th:href="@{/admin/carritos/eliminar/{id}(id=${c.idCarrito})}" class="btn btn-sm btn-danger" data-eliminar><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="text-center py-4" th:if="${#lists.isEmpty(carritos)}"><p class="text-muted">No hay carritos registrados</p></div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>
</html>
