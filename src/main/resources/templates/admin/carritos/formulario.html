<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Admin - Nuevo Carrito')}"></head>
<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('carritos')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <div class="card shadow">
                            <div class="card-header bg-success text-white">
                                <h4 class="mb-0"><i class="bi bi-cart3"></i> Nuevo Carrito</h4>
                            </div>
                            <div class="card-body">
                                <form th:action="@{/admin/carritos/guardar}" method="post">
                                    <div class="mb-3">
                                        <label class="form-label">Cliente</label>
                                        <select class="form-select" name="cliente" required>
                                            <option value="">Seleccionar cliente...</option>
                                            <option th:each="c : ${clientes}" th:value="${c.idCliente}"
                                                th:text="${c.persona != null ? c.persona.nombres + ' ' + c.persona.apellidoPaterno : 'Cliente ' + c.idCliente}"></option>
                                        </select>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Guardar</button>
                                        <a th:href="@{/admin/carritos}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Cancelar</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>
</html>
