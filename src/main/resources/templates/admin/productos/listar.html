<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/plantilla :: cabecera('Admin - Listar Productos')}"></head>

<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('productos')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
        <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${exito}">Exito</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-box-seam"></i> Productos</h1>
            <a th:href="@{/admin/productos/nuevo}" class="btn btn-success">
                <i class="bi bi-plus-circle"></i> Nuevo Producto
            </a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Imagen</th>
                        <th>SKU</th>
                        <th>Nombre</th>
                        <th>Marca</th>
                        <th>Categoria</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="producto : ${productos}">
                        <td th:text="${producto.idProducto}">1</td>
                        <td>
                            <img th:if="${producto.imagenPrincipal != null}" th:src="${producto.imagenPrincipal}"
                                th:alt="${producto.nombre}" style="height: 40px; object-fit: contain;">
                            <i th:unless="${producto.imagenPrincipal != null}" class="bi bi-box-seam text-muted"></i>
                        </td>
                        <td th:text="${producto.codigoSku}">SKU</td>
                        <td th:text="${producto.nombre}">Producto</td>
                        <td th:text="${producto.marca.nombre}">Marca</td>
                        <td th:text="${producto.categoria.nombre}">Categoria</td>
                        <td th:text="'S/ ' + ${#numbers.formatDecimal(producto.precioVenta, 1, 2)}">S/ 0.00</td>
                        <td th:text="${producto.stock}">0</td>
                        <td>
                            <span class="badge" th:classappend="${producto.vigente} ? 'bg-success' : 'bg-secondary'"
                                th:text="${producto.vigente} ? 'Activo' : 'Inactivo'">Activo</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/productos/editar/{id}(id=${producto.idProducto})}"
                                class="btn btn-sm btn-warning">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/admin/productos/eliminar/{id}(id=${producto.idProducto})}"
                                class="btn btn-sm btn-danger" data-eliminar title="Eliminar"
                                th:attr="data-nombre=${producto.nombre}">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="text-center py-4" th:if="${#lists.isEmpty(productos)}">
            <p class="text-muted">No hay productos registrados</p>
        </div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>

</html>
