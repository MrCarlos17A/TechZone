<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/plantilla :: cabecera('Admin - Formulario Producto')}"></head>

<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('productos')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="bi bi-box-seam"></i>
                            <span
                                th:text="${producto.idProducto != null} ? 'Editar Producto' : 'Nuevo Producto'">Formulario</span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <form
                            th:action="${producto.idProducto != null} ? @{/admin/productos/actualizar/{id}(id=${producto.idProducto})} : @{/admin/productos/guardar}"
                            method="post" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre del Producto</label>
                                <input type="text" class="form-control" id="nombre" name="nombre"
                                    th:value="${producto.nombre}" required>
                            </div>
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripcion</label>
                                <textarea class="form-control" id="descripcion" name="descripcion" rows="3"
                                    th:text="${producto.descripcion}"></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="precio" class="form-label">Precio (S/)</label>
                                    <input type="number" class="form-control" id="precio" name="precio" step="0.01" min="0"
                                        th:value="${producto.precio}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="stock" class="form-label">Stock</label>
                                    <input type="number" class="form-control" id="stock" name="stock" min="0"
                                        th:value="${producto.stock}" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Imagen actual</label>
                                <div>
                                    <img th:if="${producto.imagen != null and !producto.imagen.isEmpty()}" th:src="${producto.imagen}"
                                        alt="Imagen del producto" class="img-thumbnail mb-2" style="max-height: 100px;">
                                    <span th:unless="${producto.imagen != null and !producto.imagen.isEmpty()}" class="text-muted small">Sin imagen</span>
                                </div>
                                <img id="vistaPreviaNueva" alt="Vista previa" class="img-thumbnail mt-2"
                                    style="display:none; max-height: 100px;">
                            </div>
                            <div class="mb-3">
                                <label for="archivoImagen" class="form-label">Seleccionar archivo</label>
                                <input type="file" class="form-control" id="archivoImagen" name="archivoImagen"
                                    accept="image/png,image/jpeg,image/webp,image/gif">
                                <input type="hidden" name="imagen" th:value="${producto.imagen}">
                                <small class="text-muted">Elige la imagen desde tu equipo (PNG, JPG o WEBP, max. 5MB). Se guardara en la carpeta de productos.</small>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="marca" class="form-label">Marca</label>
                                    <select class="form-select" id="marca" name="marca" required>
                                        <option value="">Seleccionar marca...</option>
                                        <option th:each="m : ${marcas}" th:value="${m.idMarca}" th:text="${m.nombre}"
                                            th:selected="${producto.marca != null and producto.marca.idMarca == m.idMarca}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="categoria" class="form-label">Categoria</label>
                                    <select class="form-select" id="categoria" name="categoria" required>
                                        <option value="">Seleccionar categoria...</option>
                                        <option th:each="c : ${categorias}" th:value="${c.idCategoria}"
                                            th:text="${c.nombre}"
                                            th:selected="${producto.categoria != null and producto.categoria.idCategoria == c.idCategoria}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="estadoProducto" class="form-label">Estado</label>
                                <select class="form-select" id="estadoProducto" name="estadoProducto">
                                    <option value="true" th:selected="${producto.estadoProducto}">Activo</option>
                                    <option value="false" th:selected="${producto.estadoProducto != null and !producto.estadoProducto}">
                                        Inactivo</option>
                                </select>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Guardar
                                </button>
                                <a th:href="@{/admin/productos}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>

    <script>
        document.getElementById('archivoImagen').addEventListener('change', function (e) {
            var archivo = e.target.files[0];
            var vista = document.getElementById('vistaPreviaNueva');
            if (!archivo || !vista) return;
            var lector = new FileReader();
            lector.onload = function (ev) {
                vista.src = ev.target.result;
                vista.style.display = 'block';
            };
            lector.readAsDataURL(archivo);
        });
    </script>
</body>

</html>
