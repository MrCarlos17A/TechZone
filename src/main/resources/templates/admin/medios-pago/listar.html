<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Admin - Medios de Pago')}"></head>
<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('medios-pago')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="bi bi-wallet2"></i> Medios de Pago</h1>
                    <a th:href="@{/admin/medios-pago/nuevo}" class="btn btn-success"><i class="bi bi-plus-circle"></i> Nuevo Medio</a>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr><th>ID</th><th>Nombre</th><th>Estado</th><th>Acciones</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="mp : ${mediosPago}">
                                <td th:text="${mp.idMedioPago}">1</td>
                                <td th:text="${mp.nombre}">Nombre</td>
                                <td><span class="badge" th:classappend="${mp.vigente} ? 'bg-success' : 'bg-secondary'" th:text="${mp.vigente} ? 'Activo' : 'Inactivo'">Activo</span></td>
                                <td>
                                    <a th:href="@{/admin/medios-pago/editar/{id}(id=${mp.idMedioPago})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{/admin/medios-pago/eliminar/{id}(id=${mp.idMedioPago})}" class="btn btn-sm btn-danger" data-eliminar><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="text-center py-4" th:if="${#lists.isEmpty(mediosPago)}"><p class="text-muted">No hay medios de pago registrados</p></div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>
</html>
