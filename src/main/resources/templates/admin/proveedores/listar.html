<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Admin - Proveedores')}"></head>
<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('proveedores')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
                <div th:if="${exito}" class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle"></i> <span th:text="${exito}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="bi bi-truck"></i> Proveedores</h1>
                    <a th:href="@{/admin/proveedores/nuevo}" class="btn btn-success"><i class="bi bi-plus-circle"></i> Nuevo Proveedor</a>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr><th>ID</th><th>Razon Social</th><th>Doc.</th><th>Contacto</th><th>Correo</th><th>Estado</th><th>Acciones</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="pr : ${proveedores}">
                                <td th:text="${pr.idProveedor}">1</td>
                                <td th:text="${pr.razonSocial}">Razon</td>
                                <td th:text="${pr.numeroDocumento}">Doc</td>
                                <td th:text="${pr.telefonoContacto}">Tel</td>
                                <td th:text="${pr.correo}">Email</td>
                                <td><span class="badge" th:classappend="${pr.vigente} ? 'bg-success' : 'bg-secondary'" th:text="${pr.vigente} ? 'Activo' : 'Inactivo'">Activo</span></td>
                                <td>
                                    <a th:href="@{/admin/proveedores/editar/{id}(id=${pr.idProveedor})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{/admin/proveedores/eliminar/{id}(id=${pr.idProveedor})}" class="btn btn-sm btn-danger" data-eliminar th:attr="data-nombre=${pr.razonSocial}"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="text-center py-4" th:if="${#lists.isEmpty(proveedores)}"><p class="text-muted">No hay proveedores registrados</p></div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>
</html>
