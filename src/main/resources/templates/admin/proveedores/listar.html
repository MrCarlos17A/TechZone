<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Admin - Proveedores')}"></head>
<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('proveedores')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
                <div th:if="${exito}" class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle"></i> <span th:text="${exito}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1><i class="bi bi-truck"></i> Proveedores</h1>
                        <p class="text-muted mb-0 mt-1" style="font-size:0.88rem;">
                            <span class="filtro-contador-resultados"><strong th:text="${#lists.size(proveedores)}">0</strong> proveedor(es)</span>
                        </p>
                    </div>
                    <a th:href="@{/admin/proveedores/nuevo}" class="btn btn-success"><i class="bi bi-plus-circle"></i> Nuevo Proveedor</a>
                </div>
                <!-- Barra de filtro -->
                <div class="filtro-admin-barra">
                    <form th:action="@{/admin/proveedores}" method="get">
                        <div class="row g-2 align-items-end">
                            <div class="col-md-5">
                                <label class="form-label filtro-label-admin">Buscar proveedor</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                                    <input type="text" class="form-control" name="q" th:value="${q}" placeholder="Razon social, encargado, correo, documento...">
                                </div>
                            </div>
                            <div class="col-md-3 d-flex gap-2">
                                <button type="submit" class="btn btn-buscar flex-fill"><i class="bi bi-funnel"></i> Filtrar</button>
                                <a th:href="@{/admin/proveedores}" class="btn btn-limpiar" title="Limpiar"><i class="bi bi-x-lg"></i></a>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr><th>ID</th><th>Razon Social</th><th>Tipo Doc.</th><th>Nro. Documento</th><th>Encargado</th><th>Telefono</th><th>Correo</th><th>Estado</th><th>Acciones</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="pr : ${proveedores}">
                                <td th:text="${pr.idProveedor}">1</td>
                                <td th:text="${pr.razonSocial}">Razon</td>
                                <td th:text="${pr.tipoDocumento != null ? pr.tipoDocumento.nombre : '-'}">Tipo</td>
                                <td th:text="${pr.numeroDocumento}">Doc</td>
                                <td th:text="${pr.nombreEncargado != null ? pr.nombreEncargado : '-'}">Encargado</td>
                                <td th:text="${pr.telefonoContacto}">Tel</td>
                                <td th:text="${pr.correo}">Email</td>
                                <td><span class="badge" th:classappend="${pr.vigente} ? 'bg-success' : 'bg-secondary'" th:text="${pr.vigente} ? 'Activo' : 'Inactivo'">Activo</span></td>
                                <td>
                                    <a th:href="@{/admin/proveedores/editar/{id}(id=${pr.idProveedor})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{/admin/proveedores/eliminar/{id}(id=${pr.idProveedor})}" class="btn btn-sm btn-danger" data-eliminar th:attr="data-nombre=${pr.razonSocial}"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="estado-vacio-admin" th:if="${#lists.isEmpty(proveedores)}">
                    <i class="bi bi-truck"></i>
                    <h5>No se encontraron proveedores</h5>
                    <p th:text="${q != null and q != ''} ? 'Ningun proveedor coincide con la busqueda.' : 'No hay proveedores registrados.'">No hay proveedores</p>
                    <a th:if="${q != null and q != ''}" th:href="@{/admin/proveedores}" class="btn btn-outline-primary btn-sm mt-2">
                        <i class="bi bi-arrow-counterclockwise"></i> Limpiar filtro
                    </a>
                </div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>
</html>
