<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Admin - Formulario Imagen')}"></head>
<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('imagenes')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <div class="card shadow">
                            <div class="card-header bg-success text-white">
                                <h4 class="mb-0"><i class="bi bi-images"></i>
                                    <span th:text="${imagen.idProductoImagen != null} ? 'Editar Imagen' : 'Nueva Imagen'">Formulario</span>
                                </h4>
                            </div>
                            <div class="card-body">
                                <form th:action="${imagen.idProductoImagen != null} ? @{/admin/imagenes-producto/actualizar/{id}(id=${imagen.idProductoImagen})} : @{/admin/imagenes-producto/guardar}" method="post" enctype="multipart/form-data">
                                    <div class="mb-3">
                                        <label class="form-label">Producto</label>
                                        <select class="form-select" name="producto" required>
                                            <option value="">Seleccionar producto...</option>
                                            <option th:each="p : ${productos}" th:value="${p.idProducto}" th:text="${p.nombre}"
                                                th:selected="${imagen.producto != null and imagen.producto.idProducto == p.idProducto}"></option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Dirección de la Imagen (archivo)</label>
                                        <input type="file" class="form-control" name="archivoImagen" accept="image/*">
                                        <small class="text-muted" th:if="${imagen.urlImagen != null and !imagen.urlImagen.isEmpty()}">Imagen actual: <span th:text="${imagen.urlImagen}"></span></small>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Imagen Principal</label>
                                        <select class="form-select" name="esPrincipal">
                                            <option value="true" th:selected="${imagen.esPrincipal}">Si</option>
                                            <option value="false" th:selected="${imagen.esPrincipal == null or !imagen.esPrincipal}">No</option>
                                        </select>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Guardar</button>
                                        <a th:href="@{/admin/imagenes-producto}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Cancelar</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>
</html>
