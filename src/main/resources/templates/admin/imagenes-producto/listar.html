<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Admin - Imagenes de Producto')}"></head>
<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('imagenes')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
                <div th:if="${exito}" class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle"></i> <span th:text="${exito}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="bi bi-images"></i> Imagenes de Producto</h1>
                    <a th:href="@{/admin/imagenes-producto/nuevo}" class="btn btn-success"><i class="bi bi-plus-circle"></i> Nueva Imagen</a>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr><th>ID</th><th>Producto</th><th>Dirección de la Imagen</th><th>Principal</th><th>Acciones</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="img : ${imagenes}">
                                <td th:text="${img.idProductoImagen}">1</td>
                                <td th:text="${img.producto != null ? img.producto.nombre : 'Sin producto'}">Producto</td>
                                <td><span th:text="${img.urlImagen}" class="text-truncate d-inline-block" style="max-width: 200px;"></span></td>
                                <td><span class="badge" th:classappend="${img.esPrincipal} ? 'bg-primary' : 'bg-secondary'" th:text="${img.esPrincipal} ? 'Principal' : 'Secundaria'">Principal</span></td>
                                <td>
                                    <a th:href="@{/admin/imagenes-producto/editar/{id}(id=${img.idProductoImagen})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{/admin/imagenes-producto/eliminar/{id}(id=${img.idProductoImagen})}" class="btn btn-sm btn-danger" data-eliminar><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="text-center py-4" th:if="${#lists.isEmpty(imagenes)}"><p class="text-muted">No hay imagenes registradas</p></div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>
</html>
