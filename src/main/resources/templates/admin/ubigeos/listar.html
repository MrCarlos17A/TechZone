<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Admin - Ubigeos')}"></head>
<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('ubigeos')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
                <div th:if="${exito}" class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle"></i> <span th:text="${exito}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="bi bi-geo-alt"></i> Ubigeos</h1>
                    <a th:href="@{/admin/ubigeos/nuevo}" class="btn btn-success"><i class="bi bi-plus-circle"></i> Nuevo Ubigeo</a>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr><th>ID</th><th>Departamento</th><th>Provincia</th><th>Distrito</th><th>Estado</th><th>Acciones</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${ubigeos}">
                                <td th:text="${u.idUbigeo}">1</td>
                                <td th:text="${u.departamento}">Depto</td>
                                <td th:text="${u.provincia}">Prov</td>
                                <td th:text="${u.distrito}">Dist</td>
                                <td><span class="badge" th:classappend="${u.vigente} ? 'bg-success' : 'bg-secondary'" th:text="${u.vigente} ? 'Activo' : 'Inactivo'">Activo</span></td>
                                <td>
                                    <a th:href="@{/admin/ubigeos/editar/{id}(id=${u.idUbigeo})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{/admin/ubigeos/eliminar/{id}(id=${u.idUbigeo})}" class="btn btn-sm btn-danger" data-eliminar th:attr="data-nombre=${u.distrito}"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="text-center py-4" th:if="${#lists.isEmpty(ubigeos)}"><p class="text-muted">No hay ubigeos registrados</p></div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>
</html>
