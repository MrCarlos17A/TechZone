<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Admin - Detalle de Pago')}"></head>
<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('pagos')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="bi bi-credit-card"></i> Pago #<span th:text="${pago.idPago}">1</span></h1>
                    <a th:href="@{/admin/pagos}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
                </div>
                <div class="card shadow-sm" style="max-width: 600px;">
                    <div class="card-body">
                        <p><strong>Venta:</strong> <span th:text="${pago.venta != null ? 'Venta #' + pago.venta.idVenta : '-'}"></span></p>
                        <p><strong>Medio de Pago:</strong> <span th:text="${pago.medioPago != null ? pago.medioPago.nombre : '-'}"></span></p>
                        <p><strong>Monto:</strong> <span th:text="'S/ ' + ${#numbers.formatDecimal(pago.montoPago, 1, 2)}"></span></p>
                        <p><strong>Fecha:</strong> <span th:text="${pago.fechaPago != null ? #temporals.format(pago.fechaPago, 'dd/MM/yyyy HH:mm') : '-'}"></span></p>
                        <p><strong>Codigo Operacion:</strong> <span th:text="${pago.codigoOperacion}"></span></p>
                        <p><strong>Estado:</strong> <span class="badge" th:classappend="${pago.estadoPago == 'CONFIRMADO' ? 'bg-success' : (pago.estadoPago == 'PENDIENTE' ? 'bg-warning text-dark' : 'bg-danger')}" th:text="${pago.estadoPago}"></span></p>
                    </div>
                </div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>
</html>
