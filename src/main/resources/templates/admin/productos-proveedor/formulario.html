<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Admin - Nueva Relacion')}"></head>
<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('prod-proveedor')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <div class="card shadow">
                            <div class="card-header bg-success text-white">
                                <h4 class="mb-0"><i class="bi bi-boxes"></i> Nueva Relacion Producto-Proveedor</h4>
                            </div>
                            <div class="card-body">
                                <form th:action="@{/admin/productos-proveedor/guardar}" method="post">
                                    <div class="mb-3">
                                        <label class="form-label">Producto</label>
                                        <select class="form-select" name="producto" required>
                                            <option value="">Seleccionar producto...</option>
                                            <option th:each="p : ${productos}" th:value="${p.idProducto}" th:text="${p.nombre}"></option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Proveedor</label>
                                        <select class="form-select" name="proveedor" required>
                                            <option value="">Seleccionar proveedor...</option>
                                            <option th:each="pr : ${proveedores}" th:value="${pr.idProveedor}" th:text="${pr.razonSocial}"></option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Precio de Compra</label>
                                        <input type="number" class="form-control" name="precioCompra" step="0.01" min="0.01" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Tiempo de Pedido (dias)</label>
                                        <input type="number" class="form-control" name="tiempoPedidoDias" min="0" required>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Guardar</button>
                                        <a th:href="@{/admin/productos-proveedor}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Cancelar</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>
</html>
