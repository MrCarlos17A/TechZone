<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Admin - Producto Proveedor')}"></head>
<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('prod-proveedor')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
                <div th:if="${exito}" class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle"></i> <span th:text="${exito}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="bi bi-boxes"></i> Producto - Proveedor</h1>
                    <a th:href="@{/admin/productos-proveedor/nuevo}" class="btn btn-success"><i class="bi bi-plus-circle"></i> Nueva Relacion</a>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr><th>Producto</th><th>Proveedor</th><th>Precio Compra</th><th>Tiempo Pedido</th><th>Acciones</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="pp : ${relaciones}">
                                <td th:text="${pp.producto != null ? pp.producto.nombre : '-'}">Producto</td>
                                <td th:text="${pp.proveedor != null ? pp.proveedor.razonSocial : '-'}">Proveedor</td>
                                <td th:text="'S/ ' + ${#numbers.formatDecimal(pp.precioCompra, 1, 2)}">S/ 0.00</td>
                                <td th:text="${pp.tiempoPedidoDias + ' dias'}">0 dias</td>
                                <td>
                                    <a th:href="@{/admin/productos-proveedor/eliminar/{idProducto}/{idProveedor}(idProducto=${pp.id.idProducto}, idProveedor=${pp.id.idProveedor})}" class="btn btn-sm btn-danger" data-eliminar><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="text-center py-4" th:if="${#lists.isEmpty(relaciones)}"><p class="text-muted">No hay relaciones registradas</p></div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>
</html>
