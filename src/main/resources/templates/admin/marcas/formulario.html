<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/plantilla :: cabecera('Admin - Formulario Marca')}"></head>

<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('marcas')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">
                            <i class="bi bi-building"></i>
                            <span th:text="${marca.idMarca != null} ? 'Editar Marca' : 'Nueva Marca'">Formulario</span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <form
                            th:action="${marca.idMarca != null} ? @{/admin/marcas/actualizar/{id}(id=${marca.idMarca})} : @{/admin/marcas/guardar}"
                            method="post">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre de la Marca</label>
                                <input type="text" class="form-control" id="nombre" name="nombre"
                                    th:value="${marca.nombre}" maxlength="20" required>
                            </div>
                            <div class="mb-3">
                                <label for="vigente" class="form-label">Estado</label>
                                <select class="form-select" id="vigente" name="vigente">
                                    <option value="true" th:selected="${marca.vigente == null or marca.vigente}">Activa</option>
                                    <option value="false" th:selected="${marca.vigente != null and !marca.vigente}">
                                        Inactiva</option>
                                </select>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-success">
                                    <i class="bi bi-save"></i> Guardar
                                </button>
                                <a th:href="@{/admin/marcas}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>

</html>
