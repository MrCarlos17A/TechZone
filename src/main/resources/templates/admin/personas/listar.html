<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Admin - Personas')}"></head>
<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('personas')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
                <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle"></i> <span th:text="${exito}">Exito</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="bi bi-person"></i> Personas</h1>
                    <a th:href="@{/admin/personas/nueva}" class="btn btn-success">
                        <i class="bi bi-plus-circle"></i> Nueva Persona
                    </a>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th><th>Nombres</th><th>Ap. Paterno</th><th>Ap. Materno</th>
                                <th>Doc.</th><th>Telefono</th><th>Estado</th><th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${personas}">
                                <td th:text="${p.idPersona}">1</td>
                                <td th:text="${p.nombres}">Nombres</td>
                                <td th:text="${p.apellidoPaterno}">Paterno</td>
                                <td th:text="${p.apellidoMaterno}">Materno</td>
                                <td th:text="${p.numeroDocumento}">Doc</td>
                                <td th:text="${p.telefono}">Tel</td>
                                <td><span class="badge" th:classappend="${p.vigente} ? 'bg-success' : 'bg-secondary'"
                                    th:text="${p.vigente} ? 'Activa' : 'Inactiva'">Activa</span></td>
                                <td>
                                    <a th:href="@{/admin/personas/editar/{id}(id=${p.idPersona})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{/admin/personas/eliminar/{id}(id=${p.idPersona})}" class="btn btn-sm btn-danger" data-eliminar th:attr="data-nombre=${p.nombres}"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="text-center py-4" th:if="${#lists.isEmpty(personas)}"><p class="text-muted">No hay personas registradas</p></div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>
</html>
