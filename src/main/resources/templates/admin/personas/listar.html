<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Admin - Personas')}"></head>
<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('personas')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
                <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle"></i> <span th:text="${exito}">Exito</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1><i class="bi bi-person"></i> Personas</h1>
                        <p class="text-muted mb-0 mt-1" style="font-size:0.88rem;">
                            <span class="filtro-contador-resultados"><strong th:text="${#lists.size(personas)}">0</strong> persona(s)</span>
                        </p>
                    </div>
                    <a th:href="@{/admin/personas/nuevo}" class="btn btn-success">
                        <i class="bi bi-plus-circle"></i> Nueva Persona
                    </a>
                </div>
                <!-- Barra de filtro -->
                <div class="filtro-admin-barra">
                    <form th:action="@{/admin/personas}" method="get">
                        <div class="row g-2 align-items-end">
                            <div class="col-md-5">
                                <label class="form-label filtro-label-admin">Buscar persona</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                                    <input type="text" class="form-control" name="q" th:value="${q}" placeholder="Nombres, apellidos, documento, telefono...">
                                </div>
                            </div>
                            <div class="col-md-3 d-flex gap-2">
                                <button type="submit" class="btn btn-buscar flex-fill"><i class="bi bi-funnel"></i> Filtrar</button>
                                <a th:href="@{/admin/personas}" class="btn btn-limpiar" title="Limpiar"><i class="bi bi-x-lg"></i></a>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th><th>Nombres</th><th>Ap. Paterno</th><th>Ap. Materno</th>
                                <th>Tipo Doc.</th><th>Nro. Doc.</th><th>Telefono</th>
                                <th>Direccion</th><th>Ubigeo</th><th>Fecha Nac.</th><th>Estado</th><th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${personas}">
                                <td th:text="${p.idPersona}">1</td>
                                <td th:text="${p.nombres}">Nombres</td>
                                <td th:text="${p.apellidoPaterno}">Paterno</td>
                                <td th:text="${p.apellidoMaterno}">Materno</td>
                                <td th:text="${p.tipoDocumento != null ? p.tipoDocumento.nombre : '-'}">Tipo</td>
                                <td th:text="${p.numeroDocumento}">Doc</td>
                                <td th:text="${p.telefono}">Tel</td>
                                <td th:text="${p.direccion != null ? p.direccion : '-'}">Dir</td>
                                <td th:text="${p.ubigeo != null ? p.ubigeo.idUbigeo + ' - ' + p.ubigeo.distrito + ', ' + p.ubigeo.provincia + ', ' + p.ubigeo.departamento : '-'}">Ubigeo</td>
                                <td th:text="${p.fechaNacimiento != null ? #temporals.format(p.fechaNacimiento, 'dd/MM/yyyy') : '-'}">Fecha</td>
                                <td><span class="badge" th:classappend="${p.vigente} ? 'bg-success' : 'bg-secondary'"
                                    th:text="${p.vigente} ? 'Activa' : 'Inactiva'">Activa</span></td>
                                <td>
                                    <a th:href="@{/admin/personas/editar/{id}(id=${p.idPersona})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{/admin/personas/eliminar/{id}(id=${p.idPersona})}" class="btn btn-sm btn-danger" data-eliminar th:attr="data-nombre=${p.nombres}"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="estado-vacio-admin" th:if="${#lists.isEmpty(personas)}">
                    <i class="bi bi-person"></i>
                    <h5>No se encontraron personas</h5>
                    <p th:text="${q != null and q != ''} ? 'Ninguna persona coincide con la busqueda.' : 'No hay personas registradas.'">No hay personas</p>
                    <a th:if="${q != null and q != ''}" th:href="@{/admin/personas}" class="btn btn-outline-primary btn-sm mt-2">
                        <i class="bi bi-arrow-counterclockwise"></i> Limpiar filtro
                    </a>
                </div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>
</html>
