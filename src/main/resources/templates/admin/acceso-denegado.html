<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Admin - Acceso Denegado')}"></head>
<body>
    <div class="admin-shell" id="paginaAdmin">
        <div th:insert="~{fragments/admin :: barra-lateral('')}"></div>
        <div class="admin-principal">
            <header th:replace="~{fragments/plantilla-admin :: barra-superior}"></header>
            <main class="admin-contenido container-fluid py-4">
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <div class="card shadow text-center">
                            <div class="card-body p-5">
                                <i class="bi bi-shield-exclamation display-1 text-danger"></i>
                                <h2 class="mt-3">Acceso Denegado</h2>
                                <p class="text-muted">No tienes permiso para acceder a esta seccion del panel.</p>
                                <p th:if="${param.seccion}" class="mb-3">
                                    Seccion solicitada:
                                    <strong th:text="${#strings.capitalize(param.seccion[0])}">Roles</strong>
                                </p>
                                <p class="small text-muted">Contacta al administrador si necesitas acceso.</p>
                                <a th:href="@{/admin}" class="btn btn-primary mt-2">
                                    <i class="bi bi-speedometer2"></i> Volver al Dashboard
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
            <footer th:replace="~{fragments/plantilla-admin :: pie-admin}"></footer>
        </div>
    </div>
</body>
</html>
