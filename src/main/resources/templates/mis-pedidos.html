<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/plantilla :: cabecera('TechZone - Mis Pedidos')}"></head>

<body>
    <header th:replace="~{fragments/plantilla :: barra-navegacion('')}"></header>

    <main class="container my-4">
        <h1 class="mb-4"><i class="bi bi-receipt"></i> Mis Pedidos</h1>

        <div th:if="${#lists.isEmpty(pedidos)}" class="alert alert-info">
            <i class="bi bi-info-circle"></i> No tienes pedidos aun.
            <a th:href="@{/productos}" class="alert-link">Explora nuestros productos</a>
        </div>

        <div th:unless="${#lists.isEmpty(pedidos)}">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th># Pedido</th>
                            <th>Fecha</th>
                            <th>Detalle</th>
                            <th>Estado</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${pedidos}">
                            <td th:text="${p.id}"></td>
                            <td th:text="${p.fecha}"></td>
                            <td>
                                <details>
                                    <summary class="btn btn-sm btn-outline-primary">Ver items</summary>
                                    <ul class="mt-2 mb-0 ps-3 small" th:unless="${#lists.isEmpty(p.items)}">
                                        <li th:each="texto : ${p.items}" th:text="${texto}"></li>
                                    </ul>
                                    <span th:if="${#lists.isEmpty(p.items)}" class="small text-muted">Sin items</span>
                                </details>
                            </td>
                            <td>
                                <span class="badge"
                                    th:classappend="${p.estado == 'PENDIENTE' ? 'bg-warning' : (p.estado == 'PROCESADO' ? 'bg-info' : (p.estado == 'ENVIADO' ? 'bg-primary' : (p.estado == 'ENTREGADO' ? 'bg-success' : 'bg-danger')))}"
                                    th:text="${p.estado}"></span>
                            </td>
                            <td th:text="${p.total}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/plantilla :: pie}"></footer>
</body>

</html>
