<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/plantilla :: cabecera('TechZone - Mis Pedidos')}"></head>

<body>
    <header th:replace="~{fragments/plantilla :: barra-navegacion('')}"></header>

    <main class="container my-4">
        <h1 class="mb-4"><i class="bi bi-receipt"></i> Mis Pedidos</h1>

        <div th:if="${#lists.isEmpty(pedidos)}" class="alert alert-info">
            <i class="bi bi-info-circle"></i> No tienes pedidos aun.
            <a th:href="@{/productos}" class="alert-link">Explora nuestros productos</a>
        </div>

        <div th:unless="${#lists.isEmpty(pedidos)}">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th># Pedido</th>
                            <th>Fecha</th>
                            <th>Productos</th>
                            <th>Estado</th>
                            <th>Total</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${pedidos}" style="cursor: pointer;"
                            th:onclick="'window.location.href=\'' + @{/mis-pedidos/{id}(id=${p.id})} + '\''">
                            <td th:text="'#' + ${p.id}">#1</td>
                            <td th:text="${p.fecha}">01/01/2026</td>
                            <td>
                                <span class="text-muted small" th:if="${#lists.isEmpty(p.items)}">Sin items</span>
                                <span class="small" th:unless="${#lists.isEmpty(p.items)}"
                                    th:text="${p.items.size() + ' producto(s)'}">2 producto(s)</span>
                            </td>
                            <td>
                                <span class="badge"
                                    th:classappend="${p.estado == 'PENDIENTE' ? 'bg-warning text-dark' : (p.estado == 'PROCESADO' ? 'bg-info' : (p.estado == 'ENVIADO' ? 'bg-primary' : (p.estado == 'ENTREGADO' ? 'bg-success' : 'bg-danger')))}"
                                    th:text="${p.estado}">PENDIENTE</span>
                            </td>
                            <td class="fw-bold" th:text="'S/ ' + ${p.total}">S/ 0.00</td>
                            <td class="text-center">
                                <a th:href="@{/mis-pedidos/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary"
                                    onclick="event.stopPropagation()">
                                    <i class="bi bi-eye"></i> Ver detalle
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/plantilla :: pie}"></footer>
</body>

</html>
