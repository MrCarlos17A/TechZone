<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/plantilla :: cabecera('TechZone - Tu tienda de tecnologia')}"></head>

<body>
    <header th:replace="~{fragments/plantilla :: barra-navegacion('inicio')}"></header>

    <main class="container my-4">
        <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${exito}">Exito</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Hero Carrusel -->
        <section class="hero-section mb-5">
            <div id="carruselHero" class="carousel slide rounded-3 overflow-hidden shadow" data-bs-ride="carousel"
                data-bs-interval="4000">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carruselHero" data-bs-slide-to="0" class="active"
                        aria-label="Imagen 1"></button>
                    <button type="button" data-bs-target="#carruselHero" data-bs-slide-to="1"
                        aria-label="Imagen 2"></button>
                    <button type="button" data-bs-target="#carruselHero" data-bs-slide-to="2"
                        aria-label="Imagen 3"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img th:src="@{/Assets/IMG/Hero/Hero1.png}" class="d-block w-100 hero-img" alt="TechZone gaming">
                    </div>
                    <div class="carousel-item">
                        <img th:src="@{/Assets/IMG/Hero/Hero2.png}" class="d-block w-100 hero-img" alt="TechZone ofertas">
                    </div>
                    <div class="carousel-item">
                        <img th:src="@{/Assets/IMG/Hero/Hero3.png}" class="d-block w-100 hero-img" alt="TechZone tecnologia">
                    </div>
                </div>
                <div class="hero-overlay">
                    <h1 class="display-5 fw-bold">Bienvenido a TechZone</h1>
                    <p class="lead">Los mejores productos de tecnologia al mejor precio</p>
                    <a th:href="@{/productos}" class="btn btn-primary btn-lg">Ver Productos</a>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carruselHero" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carruselHero" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Siguiente</span>
                </button>
            </div>
        </section>

        <!-- Marcas -->
        <section class="mb-5">
            <h2 class="text-center mb-4">Nuestras Marcas</h2>
            <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3 justify-content-center">
                <div class="col" th:each="marca : ${marcas}">
                    <div class="card text-center h-100 border-0 shadow-sm">
                        <div class="card-body">
                            <img th:src="@{'/Assets/IMG/Marcas/' + ${marca.nombre} + '.png'}"
                                th:alt="${marca.nombre}" class="img-fluid mb-2"
                                style="max-height: 60px; object-fit: contain;"
                                onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                            <i class="bi bi-building display-4 text-primary" style="display: none;"></i>
                            <h6 class="card-title" th:text="${marca.nombre}">Marca</h6>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Productos Destacados por Categoria -->
        <section class="mb-5" th:each="entry : ${productosPorCategoria}">
            <div class="category-header mb-4">
                <div class="d-flex align-items-center gap-3 mb-2">
                    <div class="category-icon">
                        <i th:if="${entry.key.nombre.contains('Monitores')}" class="bi bi-display"></i>
                        <i th:if="${entry.key.nombre.contains('Tarjetas')}" class="bi bi-gpu-card"></i>
                    </div>
                    <div>
                        <h2 class="category-title mb-0" th:text="${entry.key.nombre}">Categoria</h2>
                    </div>
                </div>
                <hr class="category-divider">
            </div>
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
                <div class="col" th:each="producto : ${entry.value}">
                    <div class="card h-100 producto-card">
                        <div class="producto-img-wrapper">
                            <img th:if="${producto.imagenPrincipal != null}" th:src="${producto.imagenPrincipal}"
                                class="producto-img" th:alt="${producto.nombre}">
                            <div th:unless="${producto.imagenPrincipal != null}" class="producto-img producto-img-placeholder">
                                <i class="bi bi-box-seam"></i>
                            </div>
                            <span class="producto-badge-marca" th:text="${producto.marca.nombre}">Marca</span>
                            <span class="producto-badge-stock"
                                th:classappend="${producto.stock > 5} ? 'stock-ok' : (${producto.stock > 0} ? 'stock-bajo' : 'stock-agotado')"
                                th:text="${producto.stock > 0} ? 'Stock: ' + ${producto.stock} : 'Sin stock'">Stock</span>
                        </div>
                        <div class="card-body d-flex flex-column p-3">
                            <h5 class="producto-nombre" th:text="${producto.nombre}">Producto</h5>
                            <p class="producto-desc" th:text="${producto.descripcion}">Descripcion</p>
                            <div class="mt-auto">
                                <div class="producto-precio">
                                    <span class="precio-moneda">S/</span>
                                    <span class="precio-valor" th:text="${#numbers.formatDecimal(producto.precioVenta, 1, 2)}">0.00</span>
                                </div>
                                <button class="btn btn-primary w-100 mt-2 agregar-carrito" th:data-id="${producto.idProducto}"
                                    th:data-nombre="${producto.nombre}" th:data-precio="${producto.precioVenta}"
                                    th:data-imagen="${producto.imagenPrincipal}">
                                    <i class="bi bi-cart-plus"></i> Agregar al Carrito
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/plantilla :: pie}"></footer>

    <script th:src="@{/js/carrito.js}"></script>
    <script th:src="@{/js/documento-lookup.js}"></script>
    <script th:src="@{/js/checkout.js}"></script>
</body>

</html>
