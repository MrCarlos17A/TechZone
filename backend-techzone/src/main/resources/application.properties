# ============================================================
# TechZone Backend - Configuracion Principal de la Aplicacion
# ============================================================
spring.application.name=backend-techzone

# ============================================================
# BASE DE DATOS: Supabase PostgreSQL (HikariCP y JPA/Hibernate)
# Los valores sensibles se inyectan dinamicamente desde .env
# ============================================================
# URL de conexion JDBC a PostgreSQL
spring.datasource.url=${SUPABASE_DB_URL}
# Usuario de BD (en Transaction Pooler 6543 usa formato postgres.<ref-proyecto>)
spring.datasource.username=${SUPABASE_DB_USER:postgres}
# Contrasena de la base de datos
spring.datasource.password=${SUPABASE_DB_PASSWORD}
# Driver JDBC oficial para PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Maximo de conexiones activas simultaneas en el pool HikariCP
spring.datasource.hikari.maximum-pool-size=15
# Conexiones minimas inactivas que Hikari mantiene listas para responder
spring.datasource.hikari.minimum-idle=5
# Tiempo maximo que una conexion puede estar inactiva antes de liberarse (ms)
spring.datasource.hikari.idle-timeout=180000
# Tiempo limite de espera para obtener una conexion antes de lanzar error (15 seg)
spring.datasource.hikari.connection-timeout=15000
# Vida maxima de una conexion antes de ser reemplazada por una nueva (ms)
spring.datasource.hikari.max-lifetime=1800000
# Tiempo limite para validar si una conexion del pool sigue viva (ms)
spring.datasource.hikari.validation-timeout=3000

# Hibernate ddl-auto update: crea tablas o columnas nuevas sin alterar datos existentes
spring.jpa.hibernate.ddl-auto=update
# Mantiene la sesion Hibernate abierta durante la renderizacion de la respuesta HTTP
spring.jpa.open-in-view=true
# Desactiva prepared statements en el servidor (requerido para el pooler de Supabase en puerto 6543)
spring.datasource.hikari.data-source-properties.prepareThreshold=0
# Agrupa inserciones y actualizaciones en lotes de 20 para optimizar rendimiento de red
spring.jpa.properties.hibernate.jdbc.batch_size=20
# Oculta las sentencias SQL en consola para mantener logs limpios
spring.jpa.show-sql=false

# ============================================================
# API EXTERNA: Consulta y Autocompletado de DNI (apis.net.pe)
# ============================================================
# Endpoint del servicio REST para busqueda de personas por DNI
dni.api.url=${DNI_API_URL:https://api.apis.net.pe/v1/dni}
# Token Bearer de autorizacion para el servicio de DNI
dni.api.token=${DNI_API_TOKEN:}

# ============================================================
# ALMACENAMIENTO: Supabase Storage para Fotos de Productos
# ============================================================
# URL base de la API de Supabase
supabase.url=${SUPABASE_URL:}
# Service Role Key privada para subida y eliminacion de archivos en la nube
supabase.service-key=${SUPABASE_SERVICE_KEY:}
# Nombre del bucket publico donde se guardan las fotos
supabase.bucket=${SUPABASE_BUCKET:imagenes}

# ============================================================
# CARGA DE ARCHIVOS: Limites para Carga Multipart
# ============================================================
# Peso maximo permitido por cada archivo individual subido
spring.servlet.multipart.max-file-size=5MB
# Peso maximo permitido para la peticion HTTP completa
spring.servlet.multipart.max-request-size=5MB

# ============================================================
# SEGURIDAD: Ocultamiento de Informacion Interna al Cliente
# ============================================================
# Oculta la traza de excepciones del servidor en respuestas JSON
server.error.include-stacktrace=never
# Oculta mensajes tecnicos internos en respuestas de error
server.error.include-message=never
# Oculta detalles especificos de fallos de enlace en peticiones
server.error.include-binding-errors=never

# ============================================================
# SEGURIDAD: Tokens de Sesion JWT (JSON Web Tokens)
# ============================================================
# Clave simetrica HMAC-SHA256 para firmar y validar tokens de sesion
jwt.secret=${JWT_SECRET:b1e55296f1efd85a92828162e126b7462039307a210da139a600e912c62d6cc54e7b4f85eea9c51ef28408d54beca088}
# Tiempo de validez del Access Token: 480 minutos (8 horas)
jwt.duracion-minutos=480
# Tiempo de validez del Refresh Token: 7 dias
jwt.refresco-dias=7

# ============================================================
# CORS: Origenes Web Autorizados para Consumo de la API
# ============================================================
# URLs del cliente frontend permitidas para realizar peticiones HTTP cruzadas
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:8080}
