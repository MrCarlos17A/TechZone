spring.application.name=backend-techzone

# ============================================================
#  BASE DE DATOS · Supabase PostgreSQL
#  Aqui SOLO van placeholders. Los valores reales viven en .env
#  (gitignored) y se cargan con  iniciar.ps1  antes de arrancar.
# ============================================================
spring.datasource.url=${SUPABASE_DB_URL}
# En Supabase el usuario del pooler (6543) es  postgres.<ref-proyecto>.
# En conexion directa (5432) es simplemente  postgres.
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool pequeno: el free tier de Supabase reparte 60 conexiones directas
# entre todos los desarrolladores que se conecten.
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=3000

# update = agrega automaticamente tablas o columnas faltantes sin alterar datos existentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.show-sql=false

# ============================================================
#  API DE CONSULTA DNI
#  Cada desarrollador pone SU propio token en .env.
# ============================================================
dni.api.url=${DNI_API_URL:https://api.apis.net.pe/v1/dni}
dni.api.token=${DNI_API_TOKEN:}

# ============================================================
#  SUPABASE STORAGE · subida de imagenes
#  La service key NUNCA sale de este servidor.
# ============================================================
supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:imagenes}

# ============================================================
#  LIMITES DE SUBIDA DE IMAGENES
# ============================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ============================================================
#  SEGURIDAD · no filtrar informacion interna al navegador
# ============================================================
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ============================================================
#  FIRMA DE JWT (se usa a partir de la fase de autenticacion)
# ============================================================
jwt.secret=${JWT_SECRET:b1e55296f1efd85a92828162e126b7462039307a210da139a600e912c62d6cc54e7b4f85eea9c51ef28408d54beca088}
jwt.duracion-minutos=15
jwt.refresco-dias=7

# ============================================================
#  CORS · origenes permitidos (Angular en desarrollo)
# ============================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:8080}
