spring.application.name=backend-techzone-test

# Base de datos en memoria H2 aislada para pruebas (modo compatible PostgreSQL)
spring.datasource.url=jdbc:h2:mem:techzone_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# Parametros mockeados para integraciones externas en pruebas
dni.api.url=https://mock.api/dni
dni.api.token=mock-token
supabase.url=https://mock.supabase.co
supabase.service-key=mock-key
supabase.bucket=imagenes

# Configuracion de seguridad y JWT para pruebas
